
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Someone Special 💗</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;

            /* FOTO KALIAN */
            background:
                linear-gradient(
                    rgba(255, 192, 211, 0.50),
                    rgba(255, 228, 236, 0.50)
                ),
                url('/static/foto-kita.jpeg');

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .card {
            background: rgba(255, 255, 255, 0.94);
            width: 100%;
            max-width: 400px;
            padding: 35px 25px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(180, 60, 100, 0.25);
            backdrop-filter: blur(8px);
        }

        .heart {
            font-size: 55px;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        h1 {
            color: #e75480;
            font-size: 30px;
            margin-bottom: 10px;
        }

        p {
            color: #888;
            line-height: 1.6;
        }

        h3 {
            color: #bd4770;
            margin-top: 25px;
        }

        select, input {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: 1px solid #ffc0d3;
            border-radius: 13px;
            background: #fff8fa;
            font-size: 15px;
            outline: none;
        }

        select:focus, input:focus {
            border-color: #e75480;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 22px;
            border: none;
            border-radius: 13px;
            background: #e75480;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #cf3e6b;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 25px;
            color: #e75480;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="heart">💗</div>

        <h1>Hai, Intan Dwi Kusuma!</h1>

        <p>
            Intan kan besok kita mau ke CFD
            Jadi...
        </p>

        <h3>
            Besok kamu mau pakai baju warna apa?
        </h3>

        <form action="https://formsubmit.co/adin211107@gmail.com"
              method="POST">

            <select name="Pilihan Warna" required>
                <option value="">Pilih warna ya ❤️</option>
                <option>Putih 🤍</option>
                <option>Hitam 🖤</option>
                <option>Pink 💗</option>
                <option>Biru 💙</option>
                <option>Ungu 💜</option>
                <option>Hijau 💚</option>
                <option>Merah ❤️</option>
                <option>Cokelat 🤎</option>
                <option>Abu-abu 🩶</option>
            </select>

            <input
                type="text"
                name="Pesan Tambahan"
                placeholder="Ada pesan buat aku? (opsional)"
            >

            <input
                type="hidden"
                name="_subject"
                value="Jawaban warna baju kamu 💗"
            >

            <button type="submit">
                Kirim Jawaban 💌
            </button>

        </form>

        <div class="footer">
            Made with love ❤️
        </div>

    </div>

</body>
</html>
