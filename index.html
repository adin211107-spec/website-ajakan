
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Date With You ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe0ec, #fff5f8);
      color: #663344;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 25px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 35px #d98aa533;
      text-align: center;
    }

    h1 {
      color: #e75480;
      font-size: 29px;
      margin: 10px 0;
    }

    .subtitle {
      line-height: 1.6;
      color: #805b68;
    }

    .photo {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 18px;
      margin: 15px 0;
    }

    .heart {
      font-size: 35px;
      animation: beat 1s infinite alternate;
    }

    @keyframes beat {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }

    .field {
      margin-top: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select, input {
      width: 100%;
      padding: 13px;
      border: 1px solid #f0b8cb;
      border-radius: 12px;
      background: #fff9fb;
      color: #663344;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 24px;
      border: none;
      border-radius: 14px;
      background: #e75480;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #d83b6c;
    }

    .note {
      font-size: 12px;
      color: #997985;
      line-height: 1.5;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="heart">❤️</div>

    <h1>A Little Date With You</h1>

    <p class="subtitle">
      Ada yang mau ngajak kamu jalan nih! 🥹<br>
      Pilih tempat dan tanggal yang kamu mau, ya.
    </p>

    <img
      class="photo"
      src="foto-kita.jpeg"
      alt="Foto kita"
      onerror="this.style.display='none'"
    >

    <form id="dateForm">
      <div class="field">
        <label for="tempat">📍 Mau jalan ke mana?</label>
        <select id="tempat" required>
          <option value="">Pilih tempat dulu</option>
          <option value="Cafe">☕ Cafe</option>
          <option value="Nonton bioskop">🎬 Nonton bioskop</option>
          <option value="Jalan-jalan sore">🌇 Jalan-jalan sore</option>
          <option value="Makan bareng">🍜 Makan bareng</option>
          <option value="Terserah kamu">💗 Terserah kamu</option>
        </select>
      </div>

      <div class="field">
        <label for="tanggal">📅 Pilih tanggal</label>
        <input type="date" id="tanggal" required>
      </div>

      <div class="field">
        <label for="pesan">💌 Mau kasih pesan tambahan?</label>
        <input
          type="text"
          id="pesan"
          placeholder="Contoh: jangan telat yaa hehe"
          maxlength="200"
        >
      </div>

      <button type="submit">
        Kirim Jawaban ke WhatsApp 💌
      </button>
    </form>

    <p class="note">
      Setelah menekan tombol, WhatsApp akan terbuka.
      Tekan tombol Kirim di WhatsApp agar jawabannya sampai.
    </p>
  </main>

  <script>
    // GANTI dengan nomor WhatsApp LU.
    // Gunakan kode negara 62, tanpa tanda +, spasi, atau tanda -.
    // Contoh format: 6281234567890
    const nomorWhatsApp = "6281270856739";

    const inputTanggal = document.getElementById("tanggal");

    // Mencegah tanggal sebelum hari ini dipilih.
    const hariIni = new Date();
    const tahun = hariIni.getFullYear();
    const bulan = String(hariIni.getMonth() + 1).padStart(2, "0");
    const hari = String(hariIni.getDate()).padStart(2, "0");

    inputTanggal.min = `${tahun}-${bulan}-${hari}`;

    document.getElementById("dateForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const tempat = document.getElementById("tempat").value;
      const tanggal = inputTanggal.value;
      const pesanTambahan = document.getElementById("pesan").value.trim();

      if (!tempat || !tanggal) {
        alert("Pilih tempat dan tanggal dulu, ya ❤️");
        return;
      }

      if (nomorWhatsApp === "GANTI_DENGAN_NOMOR_LU") {
        alert("Nomor WhatsApp pemilik website belum diatur.");
        return;
      }

      const tanggalFormat = new Date(tanggal + "T12:00:00")
        .toLocaleDateString("id-ID", {
          day: "numeric",
          month: "long",
          year: "numeric"
        });

      const isiPesan =
        "💗 JAWABAN AJAKAN JALAN 💗\n\n" +
        "Haii! Aku udah pilih yaa 🥰\n\n" +
        "📍 Tempat: " + tempat + "\n" +
        "📅 Tanggal: " + tanggalFormat + "\n" +
        "💌 Pesan: " + (pesanTambahan || "Tidak ada pesan tambahan") +
        "\n\n❤️ Sampai ketemu nanti!";

      const linkWhatsApp =
        "https://wa.me/" + nomorWhatsApp +
        "?text=" + encodeURIComponent(isiPesan);

      window.location.href = linkWhatsApp;
    });
  </script>
</body>
</html>
