
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Someone Special 💗</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(
                    rgba(255, 192, 211, 0.65),
                    rgba(255, 228, 236, 0.75)
                ),
                url("foto-kita.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .card {
            background: rgba(255, 255, 255, 0.94);
            width: 100%;
            max-width: 480px;
            padding: 35px 30px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(180, 60, 100, 0.25);
            backdrop-filter: blur(8px);
            animation: muncul 1s ease;
        }

        @keyframes muncul {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .foto-kita {
            width: 155px;
            height: 155px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #ffb6d0;
            box-shadow: 0 5px 20px rgba(255, 80, 140, 0.25);
            margin-bottom: 15px;
        }

        .heart {
            font-size: 55px;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        h1 {
            color: #e75480;
            font-size: 30px;
            margin-bottom: 10px;
        }

        p { color: #888; line-height: 1.6; }

        h3 {
            color: #bd4770;
            margin-top: 25px;
            line-height: 1.4;
        }

        select, input {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid #ffc0d3;
            border-radius: 13px;
            background: #fff8fa;
            font-size: 15px;
            outline: none;
        }

        select:focus, input:focus { border-color: #e75480; }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 22px;
            border: none;
            border-radius: 13px;
            background: #e75480;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #cf3e6b;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .footer {
            margin-top: 25px;
            color: #e75480;
            font-size: 13px;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .card { padding: 30px 20px; }
            h1 { font-size: 25px; }
            .foto-kita { width: 135px; height: 135px; }
        }
    </style>
</head>

<body>
    <div class="card">

        <img
            src="foto-kita.jpeg"
            class="foto-kita"
            alt="Foto kita"
        >

        <div class="heart">💗</div>

        <h1>Hai, Intan Dwi Kusuma!</h1>

        <p>
            Intan kan besok kita mau ke CFD.
            Jadi...
        </p>

        <h3>Besok kamu mau pakai baju warna apa?</h3>

        <form id="formJawaban">

            <select id="warna" required>
                <option value="">Pilih warna ya ❤️</option>
                <option>Putih 🤍</option>
                <option>Hitam 🖤</option>
                <option>Pink 💗</option>
                <option>Biru 💙</option>
                <option>Ungu 💜</option>
                <option>Hijau 💚</option>
                <option>Merah ❤️</option>
                <option>Cokelat 🤎</option>
                <option>Abu-abu 🩶</option>
            </select>

            <input
                type="text"
                id="pesan"
                maxlength="1000"
                placeholder="Ada pesan buat aku? (opsional)"
            >

            <button type="submit" id="tombolKirim">
                Kirim Jawaban 💌
            </button>

            <div id="status" aria-live="polite"></div>
        </form>

        <div class="footer">Made with love ❤️</div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>

    <script>
        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA1qT59FQeyJZp0QJIb1OTELe22dCm0t-o",
            authDomain: "website-ajakan.firebaseapp.com",
            projectId: "website-ajakan",
            storageBucket: "website-ajakan.firebasestorage.app",
            messagingSenderId: "795797802548",
            appId: "1:795797802548:web:ddeb281b22d12e64770461",
            measurementId: "G-BXY97LS5XP"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const form = document.getElementById("formJawaban");
        const tombol = document.getElementById("tombolKirim");
        const status = document.getElementById("status");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const warna = document.getElementById("warna").value;
            const pesan = document.getElementById("pesan").value.trim();

            tombol.disabled = true;
            tombol.textContent = "Mengirim...";
            status.textContent = "";

            try {
                await db.collection("jawaban").add({
                    nama: "Intan Dwi Kusuma",
                    warna: warna,
                    pesan: pesan,
                    waktu: firebase.firestore.FieldValue.serverTimestamp()
                });

                status.textContent = "Jawaban berhasil dikirim! 💗";
                status.style.color = "#219653";
                form.reset();

            } catch (error) {
                console.error("Firebase error:", error);

                status.textContent =
                    "Jawaban gagal dikirim. Coba lagi beberapa saat ya.";

                status.style.color = "#d93025";

            } finally {
                tombol.disabled = false;
                tombol.textContent = "Kirim Jawaban 💌";
            }
        });
    </script>
</body>
</html>
